<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>大会堂 · CampusOS 建模预览</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: #1d1d1f;
        background: #edf0ed;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
          sans-serif;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100dvh;
        touch-action: none;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      header {
        position: fixed;
        top: max(20px, env(safe-area-inset-top));
        left: max(20px, env(safe-area-inset-left));
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 16px 22px;
        border-radius: 22px;
        background: #ffffffef;
        box-shadow: 0 8px 30px #23343a0a;
      }
      h1 {
        margin: 0;
        font-weight: 650;
        font-size: 21px;
        letter-spacing: -0.5px;
      }
      .meta {
        border-left: 1px solid #dfe3e2;
        padding-left: 18px;
        font-size: 14px;
        color: #647071;
      }
      .mode {
        position: fixed;
        right: 20px;
        top: 20px;
        display: flex;
        padding: 5px;
        background: #ffffffef;
        border-radius: 19px;
        box-shadow: 0 8px 30px #23343a0a;
      }
      nav {
        position: fixed;
        bottom: max(28px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 5px;
        padding: 6px;
        border-radius: 21px;
        background: #ffffffef;
        box-shadow: 0 8px 30px #23343a10;
      }
      button {
        min-width: 68px;
        min-height: 44px;
        border: 0;
        border-radius: 15px;
        padding: 0 15px;
        font: inherit;
        font-size: 14px;
        font-weight: 550;
        cursor: pointer;
        background: transparent;
        color: #1d1d1f;
        touch-action: manipulation;
      }
      button[aria-pressed="true"] {
        color: #1261bb;
        background: #eaf1fa;
      }
      button:focus-visible {
        outline: 2px solid #1261bb;
        outline-offset: 2px;
      }
      #status {
        position: fixed;
        top: 104px;
        left: 20px;
        padding: 12px 18px;
        background: white;
        border-radius: 15px;
      }
      #status:empty {
        display: none;
      }
      .credit {
        position: fixed;
        bottom: 7px;
        right: 10px;
        color: #6d7878;
        font-size: 11px;
        text-decoration: none;
      }
      @media (max-width: 600px) {
        header {
          top: max(12px, env(safe-area-inset-top));
          left: 12px;
          gap: 12px;
          padding: 13px 17px;
        }
        h1 {
          font-size: 18px;
        }
        .meta {
          padding-left: 12px;
          font-size: 13px;
        }
        .mode {
          top: 83px;
          right: 12px;
        }
        nav {
          bottom: max(28px, env(safe-area-inset-bottom));
        }
        button {
          min-width: 62px;
          padding: 0 10px;
        }
        #status {
          top: 150px;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three.module.js",
          "three/addons/": "/vendor/addons/"
        }
      }
    </script>
  </head>
  <body>
    <canvas id="model" aria-label="大会堂建筑模型，可拖动旋转"></canvas>
    <header>
      <h1>大会堂</h1>
      <span class="meta">4层楼高 · 首版预览</span>
    </header>
    <div class="mode" role="group" aria-label="模型模式">
      <button data-mode="2.5d" aria-pressed="false">2.5D</button>
      <button data-mode="3d" aria-pressed="true">3D</button>
    </div>
    <div id="status" role="status">正在加载模型…</div>
    <nav aria-label="模型视角">
      <button data-view="overall" aria-pressed="true">整体</button>
      <button data-view="front" aria-pressed="false">正面</button>
      <button data-view="side" aria-pressed="false">侧面</button>
      <button data-view="roof" aria-pressed="false">俯视</button>
    </nav>
    <a
      class="credit"
      href="https://www.openstreetmap.org/way/307250997"
      target="_blank"
      rel="noreferrer"
      >© OpenStreetMap contributors · ODbL</a
    >
    <script type="module" src="./preview.js"></script>
  </body>
</html>
