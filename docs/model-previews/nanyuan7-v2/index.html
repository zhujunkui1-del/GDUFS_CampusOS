<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>南苑7栋 · V2</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: system-ui, "Microsoft YaHei", sans-serif;
        color: #243846;
        background: #e9eef1;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100dvh;
        touch-action: none;
        cursor: grab;
      }
      canvas:active {
        cursor: grabbing;
      }
      .heading {
        position: fixed;
        left: max(20px, env(safe-area-inset-left));
        top: max(20px, env(safe-area-inset-top));
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 20px;
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.8);
        border-radius: 20px;
        box-shadow: 0 8px 28px #213b4910;
      }
      h1 {
        font-size: 19px;
        margin: 0;
        letter-spacing: -0.4px;
        font-weight: 650;
      }
      .version {
        color: #1261bb;
        font-size: 13px;
        font-weight: 650;
        background: #edf3fc;
        padding: 5px 8px;
        border-radius: 8px;
      }
      .height {
        color: #637380;
        padding-left: 16px;
        border-left: 1px solid #dde4e8;
        font-size: 14px;
      }
      nav {
        position: fixed;
        left: 50%;
        bottom: max(24px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex;
        gap: 5px;
        padding: 6px;
        border-radius: 19px;
        background: rgba(255, 255, 255, 0.95);
        box-shadow: 0 8px 28px #213b4918;
      }
      button {
        border: 0;
        color: #586b79;
        min-height: 44px;
        min-width: 70px;
        padding: 0 14px;
        border-radius: 13px;
        background: transparent;
        font-size: 14px;
        font-weight: 550;
        cursor: pointer;
        touch-action: manipulation;
      }
      button[aria-pressed="true"] {
        background: #eaf1fa;
        color: #1261bb;
      }
      button:focus-visible {
        outline: 2px solid #1261bb;
        outline-offset: 1px;
      }
      #status {
        position: fixed;
        top: 100px;
        left: 20px;
        padding: 10px 16px;
        background: white;
        border-radius: 12px;
        font-size: 16px;
      }
      #status:empty {
        display: none;
      }
      .credit {
        position: fixed;
        bottom: 7px;
        right: 10px;
        font-size: 10px;
        color: #71818b;
        text-decoration: none;
      }
      @media (max-width: 600px) {
        .heading {
          left: 12px;
          top: max(12px, env(safe-area-inset-top));
          gap: 10px;
          padding: 12px 16px;
        }
        h1 {
          font-size: 17px;
        }
        .height {
          font-size: 12px;
          padding-left: 10px;
        }
        nav {
          bottom: max(28px, env(safe-area-inset-bottom));
        }
        button {
          min-width: 66px;
          padding: 0 10px;
        }
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "/vendor/three.module.js",
          "three/addons/": "/vendor/addons/"
        }
      }
    </script>
  </head>
  <body>
    <canvas aria-label="南苑7栋第二版3D模型" id="model"></canvas>
    <header class="heading">
      <h1>南苑7栋</h1>
      <span class="version">V2</span><span class="height">7层 · 约21米</span>
    </header>
    <div id="status" role="status">正在加载模型…</div>
    <nav aria-label="模型视角">
      <button data-view="overall" aria-pressed="true">整体</button>
      <button data-view="facade" aria-pressed="false">立面</button>
      <button data-view="courtyard" aria-pressed="false">中庭</button>
      <button data-view="roof" aria-pressed="false">俯视</button>
    </nav>
    <a
      class="credit"
      href="https://www.openstreetmap.org/way/312536955"
      target="_blank"
      rel="noreferrer"
      >© OpenStreetMap contributors · ODbL</a
    >
    <script type="module" src="./preview.js"></script>
  </body>
</html>
