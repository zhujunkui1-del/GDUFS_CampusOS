<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CampusOS 宿舍性能测试</title>
    <link rel="stylesheet" href="/maplibre.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        color: #1d1d1f;
        font-family: system-ui, sans-serif;
        background: #f2f1ec;
      }
      #map {
        position: fixed;
        inset: 0;
      }
      .toolbar {
        position: fixed;
        z-index: 5;
        top: 16px;
        left: 16px;
        right: 16px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        pointer-events: none;
      }
      .toolbar > * {
        pointer-events: auto;
      }
      .badge,
      .controls {
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 8px 24px #0001;
        padding: 12px 16px;
      }
      .badge strong {
        display: block;
        font-size: 16px;
      }
      .badge span {
        color: #53606b;
        font-size: 14px;
      }
      .controls {
        display: flex;
        gap: 8px;
        padding: 6px;
      }
      button,
      select {
        min-height: 44px;
        border: 0;
        border-radius: 12px;
        background: #edf3fa;
        color: #1d1d1f;
        padding: 0 14px;
        font: inherit;
      }
      #stats {
        position: fixed;
        bottom: 16px;
        left: 16px;
        max-width: calc(100% - 32px);
        background: #fff;
        border-radius: 16px;
        padding: 12px 16px;
        font-size: 14px;
        pointer-events: none;
      }
      .marker {
        font-size: 11px;
        color: #596673;
        background: #fffd;
        border-radius: 8px;
        padding: 3px 6px;
        pointer-events: none;
      }
      .maplibregl-ctrl-attrib {
        display: none;
      }
    </style>
    <script type="importmap">
      { "imports": { "three": "/three.js" } }
    </script>
  </head>
  <body>
    <div id="map"></div>
    <div class="toolbar">
      <div class="badge">
        <strong>性能测试 · 模拟建筑</strong><span id="condition">正在加载</span>
      </div>
      <div class="controls">
        <select id="count" aria-label="测试栋数">
          <option>1</option>
          <option>10</option>
          <option>30</option>
          <option>60</option></select
        ><select id="variant" aria-label="渲染方案">
          <option value="baseline">优化前</option>
          <option value="optimized">优化后</option></select
        ><button id="mode">3D</button>
      </div>
    </div>
    <div id="stats">测试场景</div>
    <script type="module" src="/bench.js"></script>
  </body>
</html>
